<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocked by Regain</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(900px 600px at 50% 0%, rgba(124, 92, 255, 0.28), transparent 60%), #08080f;
        color: #eceaff;
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }
      h1 { font-size: 26px; margin: 12px 0 6px; }
      p { opacity: 0.72; max-width: 520px; }
      a { color: #7c5cff; font-weight: 600; text-decoration: none; }
      .hint { font-size: 13px; opacity: .55; }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
      button {
        font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
        padding: 10px 18px; border-radius: 12px; color: inherit;
        border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07);
      }
      button.primary { background: linear-gradient(120deg, #7c5cff, #38bdf8); border-color: transparent; color: #fff; }
      button:focus-visible, a:focus-visible { outline: 2px solid #7c5cff; outline-offset: 2px; }
      .foot { margin-top: 18px; display: grid; gap: 8px; justify-items: center; }
      .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; opacity: .75; }
      .card {
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.04);
        border-radius: 20px;
        padding: 28px 32px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 56px">🛡️</div>
      <h1>Blocked by Regain</h1>
      <p>
        <strong id="domain-name">This site</strong> is on your Regain blocklist.
      </p>
      <p class="hint" id="reason">Blocked while a Regain focus session is running.</p>
      <p class="hint" id="timer"></p>

      <div class="actions">
        <button class="primary" id="close-tab">✕ Close this tab</button>
        <button id="go-back">← Go back</button>
      </div>

      <div class="foot">
        <label class="row">
          <input type="checkbox" id="auto-close" />
          Close blocked tabs automatically
        </label>
        <button id="unblock" style="display:none">Blocked by mistake? Remove this site</button>
        <a href="#" id="open-regain" title="Open the Regain desktop app">Open Regain to change your rules</a>
        <span class="hint" id="status"></span>
      </div>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
